name: Cron / Update public suffix list
on:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  SOURCE_URL: https://publicsuffix.org/list/public_suffix_list.dat
  PSL_FILE: BitwardenKit/Core/Platform/Utilities/Resources/public_suffix_list.dat

jobs:
  update-psl:
    name: Update Public Suffix List
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Switch to branch
        id: switch-branch
        run: |
          BRANCH_NAME="cron-sync-public-suffix-list"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

          if git switch "$BRANCH_NAME"; then
            echo "✅ Switched to existing branch: $BRANCH_NAME"
          else
            echo "📝 Creating new branch: $BRANCH_NAME"
            git switch -c "$BRANCH_NAME"
          fi

      - name: Download latest PSL list
        run: |
          curl -s "$SOURCE_URL" -o "$PSL_FILE"

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet -- "$PSL_FILE"; then
            echo "✅ No changes detected, skipping..."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "👀 Changes detected"

      - name: Create branch and commit
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          _BRANCH_NAME: ${{ steps.switch-branch.outputs.branch_name }}
        run: |
          echo "📋 Committing public_suffix_list.dat..."

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add "$PSL_FILE"
          git commit -m "Update public suffix list"
          git push origin "$_BRANCH_NAME"

      - name: Create or Update Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          _BRANCH_NAME: ${{ steps.switch-branch.outputs.branch_name }}
        run: |
          PR_BODY="Updates the public suffix list with the latest data from $SOURCE_URL"

          EXISTING_PR=$(gh pr list --head "$_BRANCH_NAME" --base main --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "🔄 Updating existing PR #$EXISTING_PR..."
            echo -e "$PR_BODY" | gh pr edit "$EXISTING_PR" \
              --title "Update public suffix list" \
              --body-file -
            PR_URL="https://github.com/${{ github.repository }}/pull/$EXISTING_PR"
            echo "## ✅ Updated PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "📝 Creating new PR..."
            PR_URL=$(echo -e "$PR_BODY" | gh pr create \
              --title "Update public suffix list" \
              --body-file - \
              --base main \
              --head "$_BRANCH_NAME" \
              --label "automated-pr" \
              --label "t:deps")
            echo "## 🚀 Created PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

name: SDLC / Enforce PR labels
run-name: Enforce labels for PR ${{ github.event.pull_request.number || inputs.pr-number }}

on:
  pull_request:
    types: [labeled, unlabeled, edited]
  workflow_dispatch:
    inputs:
      pr-number:
        description: "Pull Request Number"
        required: true
        type: number

permissions: {}

env:
  _PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}

jobs:
  enforce-label:
    name: Enforce Label
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
      statuses: write # required to report the result on the PR head SHA for workflow_dispatch runs
    steps:
      - name: Fetch current PR labels
        id: pr-labels
        env:
          _REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          _PR_LABELS=$(gh api "repos/$_REPO/pulls/$_PR_NUMBER" --jq '.labels')
          echo "Labels fetched from PR: $_PR_LABELS"
          echo "pr_labels=$_PR_LABELS" >> "$GITHUB_OUTPUT"

      - name: Enforce banned labels (e.g. hold, needs-qa)
        env:
          _HOLD_LABEL: ${{ contains(fromJSON(steps.pr-labels.outputs.pr_labels).*.name, 'hold') }}
          _NEEDS_QA_LABEL: ${{ contains(fromJSON(steps.pr-labels.outputs.pr_labels).*.name, 'needs-qa') }}
        run: |
          if [ "$_HOLD_LABEL" = "true" ]; then
            echo "::error::PR has banned label: hold"
            exit 1
          fi
          if [ "$_NEEDS_QA_LABEL" = "true" ]; then
            echo "::error::PR has banned label: needs-qa"
            exit 1
          fi
          echo "✅ No banned labels found."

      - name: Enforce exactly one Change Type (t:*) label
        env:
          _PR_LABELS: ${{ steps.pr-labels.outputs.pr_labels }}
        run: |
          _IGNORE_FOR_RELEASE_LABEL=$(echo "$_PR_LABELS" | jq 'any(.[]; .name == "ignore-for-release")')
          if [ "$_IGNORE_FOR_RELEASE_LABEL" = "true" ]; then
            echo "⏭️ Skipping type label check - 'ignore-for-release' label present"
            exit 0
          fi
          _T_LABEL_COUNT=$(echo "$_PR_LABELS" | jq '[.[] | select(.name | startswith("t:"))] | length')
          case "$_T_LABEL_COUNT" in
            1)
              echo "✅ PR has exactly one Change Type (t:*) label"
              ;;
            0)
              echo "::error::PR #$_PR_NUMBER is missing a Change Type (t:*) label. PRs must have exactly one Change Type (t:*) label"
              exit 1
              ;;
            *)
              echo "::error::PR #$_PR_NUMBER has $_T_LABEL_COUNT Change Type (t:*) labels. PRs must have exactly one Change Type (t:*) label"
              exit 1
              ;;
          esac

      # Runs started with workflow_dispatch do not report a check on the PR.
      - name: Report PR status
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        env:
          _REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          _JOB_STATUS: ${{ job.status }}
          _RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          _HEAD_SHA=$(gh api "repos/$_REPO/pulls/$_PR_NUMBER" --jq '.head.sha')
          _STATE=$([ "$_JOB_STATUS" = "success" ] && echo success || echo failure)
          gh api "repos/$_REPO/statuses/$_HEAD_SHA" \
            -f state="$_STATE" \
            -f context="SDLC / Enforce PR labels" \
            -f description="Label enforcement: $_STATE" \
            -f target_url="$_RUN_URL"

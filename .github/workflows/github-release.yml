name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: 'GitHub Action Run ID containing artifacts'
        required: true
        type: string
      release-ticket-id:
        description: 'Release Ticket ID - e.g. RELEASE-1762'
        required: true
        type: string

permissions: {}

jobs:
  trigger-actions:
    name: Trigger release-ios in bitwarden/deploy
    runs-on: ubuntu-24.04
    permissions:
      deployments: write
      id-token: write
    steps:
      - name: Trigger release-ios workflow
        uses: bitwarden/gh-actions/trigger-actions@main
        with:
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          task: release-ios
          data: |
            {
              "artifact-run-id": "${{ inputs.artifact-run-id }}",
              "release-ticket-id": "${{ inputs.release-ticket-id }}"
            }

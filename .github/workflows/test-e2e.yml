name: Test Password Manager E2E

on:
  schedule:
    # Weekdays at 05:00 UTC. Scheduled runs are skipped until the E2E_SCHEDULE_ENABLED variable is "true".
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      test-server-url:
        description: "Base URL of the server under test. Leave all three empty to use the repository secrets"
        type: string
      seeder-url:
        description: "Base URL of that server's seeder API"
        type: string
      seeder-self-hosted:
        description: "Whether the server is self-hosted: 'true' or 'false'"
        type: string

env:
  MINT_LINK_PATH: .mint/bin # used by mint in bootstrap.sh
  MINT_PATH: .mint/lib # used by mint in bootstrap.sh
  _BUILD_RESULT_BUNDLE_PATH: build/E2E-build.xcresult
  _TESTS_RESULT_BUNDLE_PATH: build/E2E-tests.xcresult

  # xcode optimization flags
  COMPILER_INDEX_STORE_ENABLE: "NO"
  COMPILATION_CACHE_ENABLE_CACHING: "YES"
  COMPILATION_CACHE_ENABLE_PLUGIN: "YES"
  SWIFT_ENABLE_COMPILE_CACHE: "YES"
  CLANG_ENABLE_COMPILE_CACHE: "YES"
  SWIFT_ENABLE_EXPLICIT_MODULES: "YES"
  SWIFT_USE_INTEGRATED_DRIVER: "YES"
  CLANG_ENABLE_MODULES: "YES"

jobs:
  test:
    name: Test
    if: github.event_name != 'schedule' || vars.E2E_SCHEDULE_ENABLED == 'true'
    runs-on: xcode-27-xlarge
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Optimize macOS Runner
        uses: ./.github/actions/macos-runner-tuneup

      - name: Read Xcode version and simulator configuration from file
        run: |
          {
            echo "_XCODE_VERSION=$(tr -d '\n' < .xcode-version)"
            echo "_SIMULATOR_NAME=$(tr -d '\n' < .test-simulator-device-name)"
            echo "_SIMULATOR_VERSION=$(tr -d '\n' < .test-simulator-ios-version)"
          } >> "$GITHUB_ENV"

      - name: Set Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env._XCODE_VERSION }}

      - name: Configure Ruby
        uses: ruby/setup-ruby@12fd324f1d0b43274fdc8130f6980590a667c455 # v1.312.0
        with:
          bundler-cache: true

      - name: Restore Mint packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mint
          key: ${{ runner.os }}-mint-${{ hashFiles('**/Mintfile') }}
          restore-keys: |
            ${{ runner.os }}-mint-

      - name: Update local config
        run: |
          ./Scripts/update_test_local_config.sh ""

      - name: Install Homebrew Dependencies and run bootstrap.sh
        run: |
          brew update
          brew bundle
          ./Scripts/bootstrap.sh

      - name: Boot Simulator
        id: boot-simulator
        uses: ./.github/actions/boot-simulator
        with:
          simulator-name: ${{ env._SIMULATOR_NAME }}
          simulator-version: ${{ env._SIMULATOR_VERSION }}

      - name: Build
        id: build
        env:
          _SIMULATOR_ID: ${{ steps.boot-simulator.outputs.simulator-id }}
        run: |
            python Scripts/pyeetd/main.py & PYEETD_PID=$!
            xcrun xcodebuild build-for-testing \
              -workspace Bitwarden.xcworkspace \
              -scheme BitwardenE2ETests \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$_SIMULATOR_ID" \
              -derivedDataPath build/DerivedData \
              -resultBundlePath "$_BUILD_RESULT_BUNDLE_PATH" \
              -parallelizeTargets \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              -quiet
            kill "$PYEETD_PID"

      - name: Upload build result bundle
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-build-result
          compression-level: 9
          path: ${{ env._BUILD_RESULT_BUNDLE_PATH }}

      # Read from the event payload rather than `inputs` so the values never appear in a step's
      # environment block before they are masked.
      - name: Resolve the test server
        id: server
        env:
          _SECRET_SEEDER_SELF_HOSTED: ${{ secrets.E2E_SEEDER_SELF_HOSTED }}
          _SECRET_SEEDER_URL: ${{ secrets.E2E_SEEDER_URL }}
          _SECRET_TEST_SERVER_URL: ${{ secrets.E2E_TEST_SERVER_URL }}
        run: |
          read_input() { jq -r --arg name "$1" '.inputs[$name] // ""' "$GITHUB_EVENT_PATH"; }
          test_server_url=$(read_input test-server-url)
          seeder_url=$(read_input seeder-url)
          seeder_self_hosted=$(read_input seeder-self-hosted)

          if [ -z "$test_server_url$seeder_url$seeder_self_hosted" ]; then
            test_server_url="$_SECRET_TEST_SERVER_URL"
            seeder_url="$_SECRET_SEEDER_URL"
            seeder_self_hosted="$_SECRET_SEEDER_SELF_HOSTED"
          elif [ -z "$test_server_url" ] || [ -z "$seeder_url" ] || [ -z "$seeder_self_hosted" ]; then
            echo "::error::Set all three server inputs, or none of them to use the repository secrets."
            exit 1
          fi

          for url in "$test_server_url" "$seeder_url"; do
            host="${url#*://}"
            echo "::add-mask::$url"
            echo "::add-mask::${host%%/*}"
          done
          {
            echo "test-server-url=$test_server_url"
            echo "seeder-url=$seeder_url"
            echo "seeder-self-hosted=$seeder_self_hosted"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: bitwarden/gh-actions/azure-login@main
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Get Azure Key Vault secrets
        id: get-kv-secrets
        uses: bitwarden/gh-actions/get-keyvault-secrets@main
        with:
          keyvault: gh-ios
          secrets: "E2E-SEEDER-USERNAME,E2E-SEEDER-PASSWORD"

      - name: Log out from Azure
        uses: bitwarden/gh-actions/azure-logout@main

      # The configuration is set only here, so the build result bundle can't record it.
      - name: Test
        id: test
        env:
          TEST_RUNNER_BW_SEEDER_PASSWORD: ${{ steps.get-kv-secrets.outputs.E2E-SEEDER-PASSWORD }}
          TEST_RUNNER_BW_SEEDER_SELF_HOSTED: ${{ steps.server.outputs.seeder-self-hosted }}
          TEST_RUNNER_BW_SEEDER_URL: ${{ steps.server.outputs.seeder-url }}
          TEST_RUNNER_BW_SEEDER_USERNAME: ${{ steps.get-kv-secrets.outputs.E2E-SEEDER-USERNAME }}
          TEST_RUNNER_BW_TEST_SERVER_URL: ${{ steps.server.outputs.test-server-url }}
          _SIMULATOR_ID: ${{ steps.boot-simulator.outputs.simulator-id }}
        run: |
            python Scripts/pyeetd/main.py & PYEETD_PID=$!
            # -collect-test-diagnostics never: on Xcode 27 / iOS 27 simulators, xcodebuild hangs
            # 600s collecting simulator diagnostics after tests finish, even when all tests pass.
            xcrun xcodebuild test-without-building \
              -workspace Bitwarden.xcworkspace \
              -scheme BitwardenE2ETests \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$_SIMULATOR_ID" \
              -resultBundlePath "$_TESTS_RESULT_BUNDLE_PATH" \
              -derivedDataPath build/DerivedData \
              -collect-test-diagnostics never \
              -quiet
            kill "$PYEETD_PID"

      - name: Print Logs Summary
        if: always() && steps.test.outcome != 'skipped'
        run: |
          xcresultparser -f -o cli "$_TESTS_RESULT_BUNDLE_PATH"
          xcresultparser -f -o txt "$_TESTS_RESULT_BUNDLE_PATH" >> "$GITHUB_STEP_SUMMARY"
